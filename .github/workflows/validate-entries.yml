name: Validate Entries

on:
  pull_request:
    paths:
      - 'entries/**/*.toon'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Get changed word files
        id: changed
        run: |
          FILES=$(git diff --name-only \
            origin/${{ github.event.pull_request.base.ref }}...HEAD \
            -- 'entries/**/*.toon')
          echo "$FILES"
          # Turn newlines into a space-separated list for the next step
          echo "files=$(echo "$FILES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Validate changed entries
        if: steps.changed.outputs.files != ''
        run: bun scripts/validation.ts ${{ steps.changed.outputs.files }}
