name: Dori Entry

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  dori:
    if: |
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'rod520' &&
      startsWith(github.event.comment.body, '/dori')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create entry
        id: dori
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          python scripts/dori.py

      - name: Commit and push
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          ENTRY_FILE: ${{ steps.dori.outputs.file }}
          KONKANI_WORD: ${{ steps.dori.outputs.word }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$ENTRY_FILE"
          git commit -m "Add Dori entry: $KONKANI_WORD"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Comment result
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY_FILE: ${{ steps.dori.outputs.file }}
          KONKANI_WORD: ${{ steps.dori.outputs.word }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ Added \`$KONKANI_WORD\` to \`$ENTRY_FILE\`."
